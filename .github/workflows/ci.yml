name: Windows CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_integration:
        description: Run the credentialed SSH/SFTP acceptance harness
        required: false
        default: false
        type: boolean
      live_modes:
        description: Comma-separated modes (smoke,fault,scale,soak)
        required: false
        default: smoke
        type: string

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  ContinuousIntegrationBuild: true

jobs:
  x64:
    name: x64 ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Enforce product scope
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: .\.github\scripts\Assert-ProductScope.ps1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: >-
          dotnet restore .\sutty.slnx
          --locked-mode
          -p:Platform=x64
          -p:Configuration=${{ matrix.configuration }}
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false

      - name: Build
        run: >-
          dotnet build .\sutty.slnx
          --configuration ${{ matrix.configuration }}
          --no-restore
          -p:Platform=x64
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false

      - name: Run security self-tests
        if: matrix.configuration == 'Debug'
        run: dotnet run --project .\tests\sutty.Core.Security.SelfTest\sutty.Core.Security.SelfTest.csproj --configuration Debug --no-restore

      - name: Run saved-host and history self-tests
        if: matrix.configuration == 'Debug'
        run: dotnet run --project .\tests\sutty.Command.SelfTest\sutty.Command.SelfTest.csproj --configuration Debug --no-restore

      - name: Run terminal self-tests
        if: matrix.configuration == 'Debug'
        run: dotnet run --project .\tests\sutty.Terminal.SelfTest\sutty.Terminal.SelfTest.csproj --configuration Debug --no-restore

      - name: Run settings self-tests
        if: matrix.configuration == 'Debug'
        run: dotnet run --project .\tests\sutty.Setting.SelfTest\sutty.Setting.SelfTest.csproj --configuration Debug --no-restore

      - name: Run SFTP self-tests
        if: matrix.configuration == 'Debug'
        run: dotnet run --project .\tests\sutty.Sftp.SelfTest\sutty.Sftp.SelfTest.csproj --configuration Debug --no-restore

      - name: Run live SSH/SFTP acceptance
        if: matrix.configuration == 'Debug' && github.event_name == 'workflow_dispatch' && inputs.run_live_integration
        shell: pwsh
        env:
          SUTTY_TEST_MODES: ${{ inputs.live_modes }}
          SUTTY_TEST_SSH_HOST: ${{ secrets.SUTTY_TEST_SSH_HOST }}
          SUTTY_TEST_SSH_PORT: ${{ secrets.SUTTY_TEST_SSH_PORT }}
          SUTTY_TEST_SSH_USER: ${{ secrets.SUTTY_TEST_SSH_USER }}
          SUTTY_TEST_SSH_AUTH: ${{ secrets.SUTTY_TEST_SSH_AUTH }}
          SUTTY_TEST_SSH_PASSWORD: ${{ secrets.SUTTY_TEST_SSH_PASSWORD }}
          SUTTY_TEST_SSH_PRIVATE_KEY: ${{ secrets.SUTTY_TEST_SSH_PRIVATE_KEY }}
          SUTTY_TEST_SSH_KEY_PASSPHRASE: ${{ secrets.SUTTY_TEST_SSH_KEY_PASSPHRASE }}
          SUTTY_TEST_HOST_KEY_SHA256: ${{ secrets.SUTTY_TEST_HOST_KEY_SHA256 }}
          SUTTY_TEST_REMOTE_ROOT: ${{ secrets.SUTTY_TEST_REMOTE_ROOT }}
          SUTTY_TEST_KBI_ANSWERS: ${{ secrets.SUTTY_TEST_KBI_ANSWERS }}
          SUTTY_TEST_SESSION_COUNT: ${{ vars.SUTTY_TEST_SESSION_COUNT }}
          SUTTY_TEST_SOAK_MINUTES: ${{ vars.SUTTY_TEST_SOAK_MINUTES }}
          SUTTY_TEST_LARGE_GB: ${{ vars.SUTTY_TEST_LARGE_GB }}
          SUTTY_TEST_FILE_COUNT: ${{ vars.SUTTY_TEST_FILE_COUNT }}
          SUTTY_TEST_FAULT_MB: ${{ vars.SUTTY_TEST_FAULT_MB }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'sutty-live-test-key'
          $agentProvisioned = $false
          try {
            if (-not [string]::IsNullOrWhiteSpace($env:SUTTY_TEST_SSH_PRIVATE_KEY)) {
              [System.IO.File]::WriteAllText($keyPath, $env:SUTTY_TEST_SSH_PRIVATE_KEY)
              $env:SUTTY_TEST_SSH_KEY_PATH = $keyPath
            }

            if ($env:SUTTY_TEST_SSH_AUTH -eq 'Agent') {
              if (-not (Test-Path -LiteralPath $keyPath)) {
                throw 'Agent live testing requires SUTTY_TEST_SSH_PRIVATE_KEY.'
              }
              Set-Service -Name ssh-agent -StartupType Manual
              Start-Service -Name ssh-agent
              & ssh-add $keyPath
              if ($LASTEXITCODE -ne 0) { throw 'ssh-add failed for the live test key.' }
              $env:SUTTY_REQUIRE_WINDOWS_AGENT = 'true'
              $agentProvisioned = $true
              dotnet run `
                --project .\tests\sutty.Core.Security.SelfTest\sutty.Core.Security.SelfTest.csproj `
                --configuration Debug `
                --no-build `
                --no-restore
              if ($LASTEXITCODE -ne 0) { throw 'Windows Agent integration self-test failed.' }
            }

            dotnet run `
              --project .\tests\sutty.LiveServer.SelfTest\sutty.LiveServer.SelfTest.csproj `
              --configuration Debug `
              --no-build `
              --no-restore
          }
          finally {
            if ($agentProvisioned) {
              & ssh-add -D | Out-Null
            }
            if (Test-Path -LiteralPath $keyPath) {
              Remove-Item -LiteralPath $keyPath -Force
            }
          }

  arm64:
    name: ARM64 compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: >-
          dotnet restore .\sutty.slnx
          --locked-mode
          -p:Platform=ARM64
          -p:Configuration=Release
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false

      - name: Compile
        run: >-
          dotnet build .\sutty.slnx
          --configuration Release
          --no-restore
          -p:Platform=ARM64
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false

  release-artifact:
    name: Validate unsigned x64 release artifact
    runs-on: windows-latest
    needs: [x64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: >-
          dotnet restore .\sutty.slnx
          --locked-mode
          -p:Platform=x64
          -p:Configuration=Release
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false

      - name: Publish unsigned artifact
        run: >-
          dotnet publish .\src\sutty.UI\sutty.UI.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output .\artifacts\release-win-x64
          -p:Platform=x64
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxPackageSigningEnabled=false
          -p:PublishReadyToRun=false
          -p:PublishTrimmed=false
          -p:DebugSymbols=false
          -p:DebugType=None

      - name: Reject development data from the release artifact
        shell: pwsh
        run: .\.github\scripts\Assert-ReleaseArtifactClean.ps1 -ArtifactPath .\artifacts\release-win-x64

      - name: Upload verified unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: sutty-win-x64-unsigned
          path: artifacts/release-win-x64
          if-no-files-found: error
